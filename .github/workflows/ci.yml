name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --group dev
      - name: Deterministic tests
        run: uv run pytest
      - name: Model eval stub
        run: uv run python evals/local.py
