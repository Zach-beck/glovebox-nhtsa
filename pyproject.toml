[project]
name = "glovebox-nhtsa"
version = "0.1.0"
description = "Local MCP server for public NHTSA vehicle specs, recalls, complaint counts, and safety ratings."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Zacharias Beck" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
]

[project.scripts]
glovebox = "glovebox_nhtsa.cli:main"
glovebox-nhtsa = "glovebox_nhtsa.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
